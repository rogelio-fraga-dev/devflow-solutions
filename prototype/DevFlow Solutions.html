<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DevFlow Solutions</title>
  <link rel="stylesheet" href="styles.css" />
  <!-- React 18 + Babel -->
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.23.6/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <!-- Data / helpers -->
  <script src="data.js"></script>

  <!-- Components -->
  <script type="text/babel" src="components.jsx"></script>

  <!-- Pages -->
  <script type="text/babel" src="pages-projetos.jsx"></script>
  <script type="text/babel" src="pages-admin.jsx"></script>

  <!-- App shell -->
  <script type="text/babel">
    // ── helpers ──────────────────────────────────────────────
    const nextId = (arr) => (Math.max(0, ...arr.map(x => x.id || 0)) + 1);

    // ── App ──────────────────────────────────────────────────
    const App = () => {
      // Phase: 'landing' | 'login' | 'app'
      const [phase, setPhase] = React.useState('landing');

      // Authenticated user
      const [currentUser, setCurrentUser] = React.useState(null);

      // Navigation
      const [currentPath, setCurrentPath] = React.useState('/projetos');
      const [selectedProjetoId, setSelectedProjetoId] = React.useState(null);
      const [sidebarCollapsed, setSidebarCollapsed] = React.useState(false);

      // ── State: all entities ─────────────────────────────────
      const [usuarios,       setUsuarios]       = React.useState(seedUsuarios);
      const [desenvolvedores,setDesenvolvedores] = React.useState(seedDesenvolvedores);
      const [clientes,       setClientes]        = React.useState(seedClientes);
      const [projetos,       setProjetos]        = React.useState(seedProjetos);
      const [sprints,        setSprints]         = React.useState(seedSprints);
      const [timesheets,     setTimesheets]      = React.useState(seedTimesheets);
      const [custosApi,      setCustosApi]       = React.useState(seedCustosApi);
      const [custosCloud,    setCustosCloud]     = React.useState(seedCustosCloud);
      const [changeRequests, setChangeRequests]  = React.useState(seedChangeRequests);

      // ── Auth ────────────────────────────────────────────────
      const handleLogin = (email, senha) => {
        const user = usuarios.find(u => u.email === email && u.ativo);
        if (!user) return false;
        // In this prototype any password works for existing active users
        setCurrentUser(user);
        setPhase('app');
        return true;
      };

      const handleLogout = () => {
        setCurrentUser(null);
        setPhase('login');
      };

      // ── Navigation ──────────────────────────────────────────
      const navigate = (path, extra) => {
        if (path === '/projetos/:id' && extra?.projetoId) {
          setSelectedProjetoId(extra.projetoId);
          setCurrentPath('/projetos/:id');
        } else {
          setCurrentPath(path);
          if (path !== '/projetos/:id') setSelectedProjetoId(null);
        }
      };

      // ── CRUD factories ──────────────────────────────────────
      const makeCrud = (setter) => ({
        onSave: (item) => setter(prev => {
          if (item.id && prev.find(x => x.id === item.id)) {
            return prev.map(x => x.id === item.id ? item : x);
          }
          return [...prev, { ...item, id: nextId(prev) }];
        }),
        onDelete: (id) => setter(prev => prev.filter(x => x.id !== id)),
      });

      const usuariosCrud       = makeCrud(setUsuarios);
      const devCrud            = makeCrud(setDesenvolvedores);
      const clientesCrud       = makeCrud(setClientes);
      const projetosCrud       = makeCrud(setProjetos);
      const sprintsCrud        = makeCrud(setSprints);
      const timesheetsCrud     = makeCrud(setTimesheets);
      const custosApiCrud      = makeCrud(setCustosApi);
      const custosCloudCrud    = makeCrud(setCustosCloud);
      const changeRequestsCrud = makeCrud(setChangeRequests);

      // ── Sidebar nav config ──────────────────────────────────
      const navItems = [
        { label: 'Projetos',         path: '/projetos',       icon: 'folder' },
        { label: 'Sprints',          path: '/sprints',        icon: 'zap' },
        { label: 'Timesheet',        path: '/timesheet',      icon: 'clock' },
        { label: 'Change Requests',  path: '/change-requests',icon: 'refresh' },
        { label: 'Financeiro',       path: '/financeiro',     icon: 'dollar' },
        { label: 'Usuários',         path: '/usuarios',       icon: 'users' },
        { label: 'Desenvolvedores',  path: '/desenvolvedores',icon: 'code' },
        { label: 'Clientes',         path: '/clientes',       icon: 'briefcase' },
        { label: 'Custos API',       path: '/custos-api',     icon: 'cpu' },
        { label: 'Custos Cloud',     path: '/custos-cloud',   icon: 'cloud' },
      ];

      // ── Render current page ─────────────────────────────────
      const renderPage = () => {
        const path = currentPath;

        if (path === '/projetos' || path === '/') {
          return (
            <ProjetosLista
              projetos={projetos}
              clientes={clientes}
              onNavigate={navigate}
              {...projetosCrud}
            />
          );
        }
        if (path === '/projetos/:id') {
          const projeto = projetos.find(p => p.id === selectedProjetoId);
          if (!projeto) { navigate('/projetos'); return null; }
          return (
            <ProjetoDetalhe
              projeto={projeto}
              sprints={sprints.filter(s => s.projetoId === projeto.id)}
              timesheets={timesheets.filter(t => t.projetoId === projeto.id)}
              desenvolvedores={desenvolvedores}
              changeRequests={changeRequests.filter(c => c.projetoId === projeto.id)}
              onNavigate={navigate}
              onUpdateProjeto={(p) => setProjetos(prev => prev.map(x => x.id === p.id ? p : x))}
            />
          );
        }
        if (path === '/sprints') {
          return (
            <SprintsPage
              sprints={sprints}
              projetos={projetos}
              desenvolvedores={desenvolvedores}
              {...sprintsCrud}
            />
          );
        }
        if (path === '/timesheet') {
          return (
            <TimesheetPage
              timesheets={timesheets}
              projetos={projetos}
              desenvolvedores={desenvolvedores}
              sprints={sprints}
              {...timesheetsCrud}
            />
          );
        }
        if (path === '/change-requests') {
          return (
            <ChangeRequestsPage
              changeRequests={changeRequests}
              projetos={projetos}
              {...changeRequestsCrud}
            />
          );
        }
        if (path === '/financeiro') {
          return (
            <FinanceiroPage
              projetos={projetos}
              timesheets={timesheets}
              desenvolvedores={desenvolvedores}
              custosApi={custosApi}
              custosCloud={custosCloud}
              changeRequests={changeRequests}
            />
          );
        }
        if (path === '/usuarios') {
          return (
            <UsuariosPage
              usuarios={usuarios}
              {...usuariosCrud}
            />
          );
        }
        if (path === '/desenvolvedores') {
          return (
            <DesenvolvedoresPage
              desenvolvedores={desenvolvedores}
              projetos={projetos}
              {...devCrud}
            />
          );
        }
        if (path === '/clientes') {
          return (
            <ClientesPage
              clientes={clientes}
              {...clientesCrud}
            />
          );
        }
        if (path === '/custos-api') {
          return (
            <CustosApiPage
              custosApi={custosApi}
              projetos={projetos}
              {...custosApiCrud}
            />
          );
        }
        if (path === '/custos-cloud') {
          return (
            <CustosCloudPage
              custosCloud={custosCloud}
              projetos={projetos}
              {...custosCloudCrud}
            />
          );
        }
        return <div style={{ padding: 40, color: 'var(--text-muted)' }}>Página não encontrada.</div>;
      };

      // ── Breadcrumb ──────────────────────────────────────────
      const getBreadcrumb = () => {
        const map = {
          '/projetos': [{ label: 'Projetos' }],
          '/projetos/:id': [
            { label: 'Projetos', path: '/projetos' },
            { label: projetos.find(p => p.id === selectedProjetoId)?.nome || 'Detalhe' }
          ],
          '/sprints':          [{ label: 'Sprints' }],
          '/timesheet':        [{ label: 'Timesheet' }],
          '/change-requests':  [{ label: 'Change Requests' }],
          '/financeiro':       [{ label: 'Financeiro' }],
          '/usuarios':         [{ label: 'Usuários' }],
          '/desenvolvedores':  [{ label: 'Desenvolvedores' }],
          '/clientes':         [{ label: 'Clientes' }],
          '/custos-api':       [{ label: 'Custos de API' }],
          '/custos-cloud':     [{ label: 'Custos Cloud' }],
        };
        return map[currentPath] || [{ label: 'DevFlow' }];
      };

      // ── Render phases ───────────────────────────────────────
      if (phase === 'landing') {
        return (
          <ToastProvider>
            <LandingPage onEnter={() => setPhase('login')} />
          </ToastProvider>
        );
      }

      if (phase === 'login') {
        return (
          <ToastProvider>
            <LoginPage
              onLogin={handleLogin}
              onBack={() => setPhase('landing')}
            />
          </ToastProvider>
        );
      }

      // phase === 'app'
      return (
        <ToastProvider>
          <div style={{ display: 'flex', height: '100vh', overflow: 'hidden', background: 'var(--bg-page)' }}>
            <Sidebar
              collapsed={sidebarCollapsed}
              onToggle={() => setSidebarCollapsed(c => !c)}
              currentPath={currentPath}
              onNavigate={(path) => navigate(path)}
              user={currentUser}
              onLogout={handleLogout}
              navItems={navItems}
            />
            <div style={{ flex: 1, display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>
              <Header
                breadcrumb={getBreadcrumb()}
                onNavigate={navigate}
                user={currentUser}
                onToggleSidebar={() => setSidebarCollapsed(c => !c)}
              />
              <main style={{ flex: 1, overflowY: 'auto' }}>
                {renderPage()}
              </main>
            </div>
          </div>
        </ToastProvider>
      );
    };

    // ── Mount ────────────────────────────────────────────────
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
