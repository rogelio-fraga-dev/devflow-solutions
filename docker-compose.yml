# ========================================================
# DevFlow Solutions — Docker Compose (Produção Completa)
# ========================================================
# Uso:  docker compose up -d --build
# URL:  http://localhost (Frontend) | http://localhost:8080 (API)
# ========================================================

services:

  # --- Banco de Dados MySQL 8.0 ---
  devflow-mysql:
    image: mysql:8.0
    container_name: devflow_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: devflow_root_secret
      MYSQL_DATABASE: devflow_db
      MYSQL_USER: devflow_user
      MYSQL_PASSWORD: devflow_senha123
    ports:
      - "3307:3306"
    volumes:
      - devflow_mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Backend Spring Boot (Java 21) ---
  devflow-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devflow_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://devflow-mysql:3306/devflow_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
      SPRING_DATASOURCE_USERNAME: devflow_user
      SPRING_DATASOURCE_PASSWORD: devflow_senha123
      API_SECURITY_TOKEN_SECRET: devflow-2026-chave-secreta-pi
    depends_on:
      devflow-mysql:
        condition: service_healthy

  # --- Frontend Angular 21 (Nginx) ---
  devflow-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: devflow_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - devflow-backend

volumes:
  devflow_mysqldata: