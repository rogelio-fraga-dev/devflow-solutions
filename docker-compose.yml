# ========================================================
# DevFlow Solutions — Docker Compose (Produção Completa)
# ========================================================
# Uso:  docker compose up -d --build
# URL:  http://localhost (Frontend) | http://localhost:8080 (API)
#
# Variáveis sensíveis aceitam override via arquivo .env (ver .env.example).
# Sem .env, sobem com defaults de desenvolvimento — funciona de primeira.
# ========================================================

services:

  # --- Banco de Dados PostgreSQL 16 ---
  devflow-postgres:
    image: postgres:16
    container_name: devflow_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-devflow_db}
      POSTGRES_USER: ${POSTGRES_USER:-devflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devflow_senha123}
    ports:
      - "5432:5432"
    volumes:
      - devflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devflow_user} -d ${POSTGRES_DB:-devflow_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Backend Spring Boot (Java 21) ---
  devflow-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devflow_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://devflow-postgres:5432/${POSTGRES_DB:-devflow_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-devflow_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-devflow_senha123}
      API_SECURITY_TOKEN_SECRET: ${API_SECURITY_TOKEN_SECRET:-devflow-2026-chave-secreta-pi}
    depends_on:
      devflow-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  # --- Frontend Angular 21 (Nginx) ---
  devflow-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: devflow_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      devflow-backend:
        condition: service_healthy

volumes:
  devflow_pgdata:
